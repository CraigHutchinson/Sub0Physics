name: Upstream drift

# Reports what changed in BikeLab since the commit recorded in upstream/bikelab.json, as one open
# issue that is updated in place. The logic is shared: Sub0Math tools/provenance and its reusable
# workflow. Files this repository does not own (`driftOwner` in the manifest) are left to the owner.
# Re-port, then run `upstream_provenance.py record` (docs/UPSTREAM.md).

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [upstream/bikelab.json]

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-drift

jobs:
  drift:
    # Honours the explicit no-CI gate (docs/ci-strategy.md).
    if: ${{ vars.CI_MODE != 'off' }}
    # Shared tooling pinned to a Sub0Math commit; keep both refs equal when moving it.
    uses: CraigHutchinson/Sub0Math/.github/workflows/upstream-drift-reusable.yml@ddd422c8c28385e1bf62b0fedf96292d0402ef53
    with:
      sub0math-ref: ddd422c8c28385e1bf62b0fedf96292d0402ef53
      manifest: upstream/bikelab.json
    permissions:
      contents: read
      issues: write
