name: CI full

# Full tier (docs/ci-strategy.md): Linux GCC and Clang, an FMA leg, MSVC, macOS, sanitizers,
# `ctest --preset full`, provenance.
# Triggers: release tags, manual dispatch, a pull request labelled ci:full, and a weekly run that is skipped when
# main has not changed since the last successful full run. Honours CI_MODE (off | smoke | full) and ci:skip.

on:
  push:
    tags: ['v*', 'milestone/*']
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
  schedule:
    - cron: '23 5 * * 1'

concurrency:
  group: ci-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # Runs only with a ci:full label on pull requests; the schedule only when main changed; never while CI is off.
    uses: CraigHutchinson/.github/.github/workflows/change-gate.yml@789478c64113b201e518810a3ef6fbf1bf1b1b90
    with:
      full-workflow-file: ci-full.yml
    permissions: { contents: read, actions: read }

  full:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: CraigHutchinson/.github/.github/workflows/cpp-full.yml@789478c64113b201e518810a3ef6fbf1bf1b1b90
    with:
      cpm-cache-key-files: CMakeLists.txt cmake/Dependencies.cmake
      extra-cmake-args: -DSUB0PHYSICS_WARNINGS_AS_ERRORS=ON -DSUB0PHYSICS_BUILD_BENCHMARKS=OFF -DSUB0MATH_PERF_ON_BUILD=OFF -DSUB0MATH_PERF_GIT_HOOKS=OFF
      fma: true
      fma-cc: clang-19
      fma-cxx: clang++-19
      windows: true
      macos: true
      sanitizers: true
    permissions: { contents: read, statuses: write, actions: read, pull-requests: read, checks: read }

  provenance:
    name: upstream provenance
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read upstream repository
        id: upstream
        run: echo "repository=$(jq -r '.repository | sub("https://github.com/"; "")' upstream/bikelab.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.upstream.outputs.repository }}
          path: .upstream/bikelab
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: CraigHutchinson/Sub0Math
          ref: ddd422c8c28385e1bf62b0fedf96292d0402ef53  # shared Sub0Math tooling; keep equal to upstream-drift.yml
          path: .sub0math
          sparse-checkout: tools/provenance
      - name: Check ported commit and blobs
        run: python3 .sub0math/tools/provenance/upstream_provenance.py check --upstream-dir .upstream/bikelab

  # Reports ci/policy for pull requests once every job above has finished (no waiting on a billed runner).
  policy:
    needs: [full, provenance]
    if: ${{ always() && github.event_name == 'pull_request' }}
    uses: CraigHutchinson/.github/.github/workflows/ci-policy.yml@789478c64113b201e518810a3ef6fbf1bf1b1b90
    with:
      upstream-result: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
    permissions: { contents: read, statuses: write, checks: read }
